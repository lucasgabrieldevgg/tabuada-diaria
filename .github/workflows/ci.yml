name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: higiene anti-vibe
        run: |
          grep -q "prefers-reduced-motion" index.html
          grep -q "Caveat" index.html
          ! grep -rEn "ghp_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}|AIzaSy" index.html tests/
          test -f LICENSE && test -f .gitignore
